# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f5af56f9dc71517699b187982064ef46"
# PLACEHOLDER HOST: replace every "shopify-ai-virtual-try-on.vercel.app" below with the real
# Vercel production domain. application_url, [auth].redirect_urls and [app_proxy].url must
# all use the same host.
application_url = "https://shopify-ai-virtual-try-on.vercel.app"
# Storefront-only app: the admin dashboard is a static Vite page with no App Bridge and no
# session-token auth, so it cannot run inside the Shopify admin iframe.
embedded = false
name = "Tryon Product"

[webhooks]
# 2026-07 is the latest released stable version as of 2026-09-02 (2026-10 ships Oct 1, 2026 and
# is currently only a release candidate).
api_version = "2026-07"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Intentionally empty: the app makes no Admin API calls. It only serves the app proxy and a
# theme app extension, neither of which requires an access scope.
scopes = ""

[auth]
redirect_urls = [ "https://shopify-ai-virtual-try-on.vercel.app/api/auth" ]

[app_proxy]
# prefix + subpath => storefront path /apps/virtual-try-on, which the widget POSTs to.
url = "https://shopify-ai-virtual-try-on.vercel.app/api/proxy"
subpath = "virtual-try-on"
prefix = "apps"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
